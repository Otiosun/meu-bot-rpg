name: Patch Raid Self Inspection

on:
  push:
    branches:
      - agent/raid-self-inspection-v1
    paths:
      - scripts/patchRaidSelfInspection.js
      - .github/workflows/patch-raid-self-inspection.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/raid-self-inspection-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply surgical patch
        run: node scripts/patchRaidSelfInspection.js

      - name: Check syntax
        run: |
          node --check helpers/clover/raidService.js
          node --check tests/raidFoundation.test.js

      - name: Install dependencies
        run: npm ci

      - name: Test economy and raids
        run: npm run test:economy-operations

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helpers/clover/raidService.js tests/raidFoundation.test.js
          git rm scripts/patchRaidSelfInspection.js .github/workflows/patch-raid-self-inspection.yml
          git commit -m "fix(raids): permitir leitura da própria ficha"
          git push origin HEAD:agent/raid-self-inspection-v1
