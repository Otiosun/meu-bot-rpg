name: Clover safety tests

on:
  pull_request:
    branches:
      - main
      - fix/clover-spell-queue-resilience-v1
      - feat/clover-database-integrity-diagnostics-v1
      - feat/clover-player-lifecycle-v1
      - feat/clover-script-lifecycle-v1
      - feat/clover-script-jobs-v1
      - feat/clover-lifecycle-undo-v1
      - feat/clover-admin-views-v1
      - feat/clover-script-selectors-v1
      - feat/clover-member-removal-v1
      - feat/clover-safe-player-reset-v1
      - fix/clover-remove-legacy-hard-delete-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clover-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check new command and services
        run: |
          node --check helpers/commandRegistry.js
          node --check helpers/clover/timeService.js
          node --check helpers/clover/structuredFormParser.js
          node --check helpers/clover/evaluationFormSchemas.js
          node --check helpers/clover/migrationFeatureFlags.js
          node --check helpers/clover/spellQueueAdminService.js
          node --check comandos/filaAdmin.js
          node --check helpers/clover/databaseIntegrityService.js
          node --check comandos/diagnosticarBanco.js
          node --check helpers/clover/playerLifecycleService.js
          node --check comandos/estadoPlayer.js
          node --check helpers/clover/cloverScriptLifecycleService.js
          node --check helpers/clover/cloverScriptJobService.js
          node --check helpers/clover/playerLifecycleUndoService.js
          node --check helpers/clover/cloverScriptUndoService.js
          node --check helpers/clover/cloverAdminViewService.js
          node --check helpers/clover/cloverAdminViewFacade.js
          node --check helpers/clover/cloverScriptSelectorService.js
          node --check helpers/clover/cloverScriptSelectorFacade.js
          node --check helpers/clover/cloverScriptMemberService.js
          node --check helpers/clover/playerResetService.js
          node --check helpers/clover/cloverScriptResetService.js
          node --check helpers/clover/cloverScriptResetFacade.js
          node --check helpers/clover/playerReset.js
          node --check helpers/clover/antiGhostSafeService.js
          node --check helpers/clover/cloverScriptAntiGhostApplyService.js
          node --check comandos/cloverAdminView.js
          node --check comandos/cloverSimulation.js
          node --check comandos/cloverApply.js
          node --check comandos/antiGhostSafeRemoval.js
          node --check comandos/cloverScript.js

      - name: Test Gate 1 foundations
        run: node --test tests/gate1Foundations.test.js tests/migrationFeatureFlags.test.js

      - name: Test spell queue resilience
        run: node --test tests/spellQueueAdminService.test.js

      - name: Test database integrity diagnostics
        run: node --test tests/databaseIntegrityService.test.js

      - name: Test player lifecycle
        run: node --test tests/playerLifecycleService.test.js

      - name: Test lifecycle CloverScript integration
        shell: bash
        run: |
          set -o pipefail
          node --test tests/cloverScriptLifecycleService.test.js 2>&1 | tee lifecycle-test.log

      - name: Test persistent CloverScript jobs
        run: node --test tests/cloverScriptJobService.test.js

      - name: Test lifecycle undo service
        run: node --test tests/playerLifecycleUndoService.test.js

      - name: Test lifecycle undo CloverScript integration
        shell: bash
        run: |
          set -o pipefail
          node --test tests/cloverScriptUndoService.test.js 2>&1 | tee undo-test.log

      - name: Test administrative views
        shell: bash
        run: |
          set -o pipefail
          node --test tests/cloverAdminViewFacade.test.js 2>&1 | tee admin-view-test.log

      - name: Test guarded selectors
        shell: bash
        run: |
          set -o pipefail
          node --test tests/cloverScriptSelectorService.test.js 2>&1 | tee selector-test.log

      - name: Test protected member removal
        shell: bash
        run: |
          set -o pipefail
          node --test tests/cloverScriptMemberService.test.js 2>&1 | tee member-test.log

      - name: Test safe player reset domain
        shell: bash
        run: |
          set -o pipefail
          node --test tests/playerResetService.test.js 2>&1 | tee player-reset-test.log

      - name: Test safe player reset CloverScript integration
        shell: bash
        run: |
          set -o pipefail
          node --test tests/cloverScriptResetService.test.js 2>&1 | tee script-reset-test.log

      - name: Test legacy reset compatibility
        shell: bash
        run: |
          set -o pipefail
          node --test tests/playerResetCompatibility.test.js 2>&1 | tee legacy-reset-test.log

      - name: Test safe anti-ghost apply routing
        shell: bash
        run: |
          set -o pipefail
          node --test tests/cloverScriptAntiGhostApplyService.test.js 2>&1 | tee antighost-apply-test.log

      - name: Test direct anti-ghost safety
        shell: bash
        run: |
          set -o pipefail
          node --test tests/antiGhostSafeRemoval.test.js 2>&1 | tee antighost-direct-test.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clover-safety-failure-logs
          path: |
            lifecycle-test.log
            undo-test.log
            admin-view-test.log
            selector-test.log
            member-test.log
            player-reset-test.log
            script-reset-test.log
            legacy-reset-test.log
            antighost-apply-test.log
            antighost-direct-test.log
          if-no-files-found: ignore
          retention-days: 1
