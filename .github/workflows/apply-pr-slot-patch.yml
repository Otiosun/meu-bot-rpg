name: Apply slot patch PR

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/real-slot-rolls-and-trait-aliases-20260721'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: |
          set +e
          node scripts/applyRealSlotRollPatch.js > /tmp/slot-patch.log 2>&1
          status=$?
          cat /tmp/slot-patch.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/slot-patch.log patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add patch-error.txt
            git commit -m "chore(ci): registrar falha do patch de vagas" || true
            git push origin HEAD:${{ github.event.pull_request.head.ref }} || true
            exit "$status"
          fi

      - name: Check syntax
        run: |
          node --check helpers/clover/rollEngine.js
          node --check helpers/magicManager.js
          node --check helpers/clover/systemMessages.js
          node --check comandos/tracos.js

      - name: Install and test
        run: |
          npm ci
          npm run test:economy-foundation

      - name: Remove temporary branch files and commit
        run: |
          rm -f scripts/applyRealSlotRollPatch.js
          rm -f .github/workflows/apply-real-slot-roll-patch.yml
          rm -f patch-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(vagas): sincronizar rolls e reservas reais"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
