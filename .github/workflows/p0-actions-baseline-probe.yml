name: P0 Actions baseline probe

on:
  pull_request:
    paths:
      - '.github/workflows/p0-actions-baseline-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime diagnostics
        run: |
          echo "runner_os=$RUNNER_OS"
          node --version
          npm --version
          git --version

      - name: Repository smoke check
        run: |
          test -f package.json
          node --check database.js
