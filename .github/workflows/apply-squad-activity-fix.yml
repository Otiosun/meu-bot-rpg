name: Apply Squad Activity Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/patches/squad-administrative-activity.patch'
      - '.github/workflows/apply-squad-activity-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-squad-activity-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-patch:
    if: github.head_ref == 'feat/site-access-context'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/site-access-context
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        shell: bash
        run: |
          git apply --check scripts/patches/squad-administrative-activity.patch
          git apply scripts/patches/squad-administrative-activity.patch

      - name: Validate activity separation
        run: |
          node --check helpers/clover/squadStateService.js
          node --check scripts/check-site-access-payload.js
          node scripts/check-site-access-payload.js

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helpers/clover/squadStateService.js scripts/check-site-access-payload.js
          git commit -m "fix(clover): separar atividade de membros e gastos do QG"
          git push origin HEAD:feat/site-access-context
