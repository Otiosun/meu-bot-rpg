name: Spellbook Presentation

on:
  pull_request:
    paths:
      - 'comandos/grimorio.js'
      - 'comandos/feitico.js'
      - 'helpers/clover/spellbookPresentation.js'
      - 'helpers/clover/spellbookService.js'
      - 'scripts/check-spellbook-presentation.js'
      - '.github/workflows/spellbook-presentation.yml'
  push:
    branches:
      - main
    paths:
      - 'comandos/grimorio.js'
      - 'comandos/feitico.js'
      - 'helpers/clover/spellbookPresentation.js'
      - 'helpers/clover/spellbookService.js'
      - 'scripts/check-spellbook-presentation.js'
      - '.github/workflows/spellbook-presentation.yml'

permissions:
  contents: read

concurrency:
  group: spellbook-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellbook-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check comandos/grimorio.js
          node --check comandos/feitico.js
          node --check helpers/clover/spellbookPresentation.js
          node --check scripts/check-spellbook-presentation.js

      - name: Check spellbook presentation
        run: node scripts/check-spellbook-presentation.js

      - name: Upload review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spellbook-presentation-review
          path: artifacts/spellbook-presentation/**
          if-no-files-found: error
          retention-days: 14
