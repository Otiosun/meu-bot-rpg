name: Patch Market Seller Identity V3

on:
  push:
    branches:
      - agent/market-fixed-sale-v3
    paths:
      - scripts/patchMarketSellerIdentity.mjs
      - .github/workflows/patch-market-seller-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/market-fixed-sale-v3
          fetch-depth: 0

      - name: Apply backend patch
        run: node scripts/patchMarketSellerIdentity.mjs

      - name: Validate syntax
        run: node --check helpers/clover/marketService.js

      - name: Commit source and remove temporary patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helpers/clover/marketService.js tests/marketOperationsV1.test.js
          git rm scripts/patchMarketSellerIdentity.mjs .github/workflows/patch-market-seller-v3.yml
          git commit -m "feat(mercado): incluir identidade e banca do vendedor"
          git push origin HEAD:agent/market-fixed-sale-v3
