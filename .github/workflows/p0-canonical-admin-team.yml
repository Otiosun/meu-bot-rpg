name: P0 canonical admin team

on:
  pull_request:
    paths:
      - '.github/workflows/p0-canonical-admin-team.yml'
      - 'helpers/clover/canonicalAdminTeam*.js'
      - 'helpers/clover/adminApiSupport.js'
      - 'helpers/clover/adminAccessService.js'
      - 'helpers/clover/canonicalRole*.js'
      - 'tests/canonicalAdminTeam*.test.js'
      - 'tests/cloverAdmin*.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-admin-team:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check helpers/clover/canonicalAdminTeamService.js
          node --check helpers/clover/canonicalAdminTeamHttp.js
          node --check helpers/clover/adminApiSupport.js

      - name: Canonical team lifecycle
        run: |
          node --test \
            tests/canonicalAdminTeamService.test.js \
            tests/canonicalAdminTeamHttp.test.js

      - name: Canonical role and admin regressions
        run: |
          node --test \
            tests/canonicalRoleGrantContract.test.js \
            tests/canonicalRolePermissionMatrixContract.test.js \
            tests/cloverAdminAccessService.test.js \
            tests/cloverAdminOperationApi.test.js

      - name: Full admin regression
        run: npm run test:admin-core

      - name: Site authorization regression
        run: npm run test:site-auth

      - name: Site stack regression
        run: npm run test:site-stack
