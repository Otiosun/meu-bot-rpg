name: PA Shop

on:
  pull_request:
    paths:
      - 'comandos/servicoAdm.js'
      - 'comandos/inventario.js'
      - 'helpers/clover/adminService.js'
      - 'helpers/clover/paAdminPayoutService.js'
      - 'helpers/clover/paCommandService.js'
      - 'helpers/clover/paCommandPresentationFinal.js'
      - 'helpers/clover/paCommandItemsFinal.js'
      - 'helpers/clover/paCommandSceneWeekFinal.js'
      - 'helpers/clover/paItemUseService.js'
      - 'helpers/clover/paSceneWeekService.js'
      - 'helpers/clover/paShopCatalog.js'
      - 'helpers/clover/paShopSchema.js'
      - 'helpers/clover/paShopService.js'
      - 'helpers/clover/spellbookService.js'
      - 'scripts/simulate-pa-shop.js'
      - 'scripts/check-pa-presentation.js'
      - 'scripts/simulate-pa-admin-payout.js'
      - 'scripts/simulate-pa-items.js'
      - 'scripts/check-pa-inventory-hints.js'
      - 'scripts/simulate-pa-scene-week.js'
      - 'package.json'
      - '.github/workflows/pa-shop.yml'
  push:
    branches:
      - main
      - feat/capacity-catalog
    paths:
      - 'comandos/servicoAdm.js'
      - 'comandos/inventario.js'
      - 'helpers/clover/adminService.js'
      - 'helpers/clover/paAdminPayoutService.js'
      - 'helpers/clover/paCommandService.js'
      - 'helpers/clover/paCommandPresentationFinal.js'
      - 'helpers/clover/paCommandItemsFinal.js'
      - 'helpers/clover/paCommandSceneWeekFinal.js'
      - 'helpers/clover/paItemUseService.js'
      - 'helpers/clover/paSceneWeekService.js'
      - 'helpers/clover/paShopCatalog.js'
      - 'helpers/clover/paShopSchema.js'
      - 'helpers/clover/paShopService.js'
      - 'helpers/clover/spellbookService.js'
      - 'scripts/simulate-pa-shop.js'
      - 'scripts/check-pa-presentation.js'
      - 'scripts/simulate-pa-admin-payout.js'
      - 'scripts/simulate-pa-items.js'
      - 'scripts/check-pa-inventory-hints.js'
      - 'scripts/simulate-pa-scene-week.js'
      - 'package.json'
      - '.github/workflows/pa-shop.yml'

permissions:
  contents: read

concurrency:
  group: pa-shop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pa-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check comandos/servicoAdm.js
          node --check comandos/inventario.js
          node --check helpers/clover/paAdminPayoutService.js
          node --check helpers/clover/paCommandService.js
          node --check helpers/clover/paCommandPresentationFinal.js
          node --check helpers/clover/paCommandItemsFinal.js
          node --check helpers/clover/paCommandSceneWeekFinal.js
          node --check helpers/clover/paItemUseService.js
          node --check helpers/clover/paSceneWeekService.js
          node --check helpers/clover/paShopCatalog.js
          node --check helpers/clover/paShopSchema.js
          node --check helpers/clover/paShopService.js
          node --check scripts/simulate-pa-shop.js
          node --check scripts/check-pa-presentation.js
          node --check scripts/simulate-pa-admin-payout.js
          node --check scripts/simulate-pa-items.js
          node --check scripts/check-pa-inventory-hints.js
          node --check scripts/simulate-pa-scene-week.js

      - name: Simulate PA shop
        run: npm run simulate:pa-shop

      - name: Check PA presentation
        run: npm run check:pa-presentation

      - name: Simulate safe administrative payout
        run: npm run simulate:pa-admin-payout

      - name: Simulate PA item use
        run: npm run simulate:pa-items

      - name: Check PA inventory hints
        run: npm run check:pa-inventory-hints

      - name: Simulate PA scene-week attribution
        run: npm run simulate:pa-scene-week

      - name: Upload PA shop review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa-shop-review
          path: |
            artifacts/pa-shop/**
            artifacts/pa-scene-week/**
          if-no-files-found: error
          retention-days: 14
