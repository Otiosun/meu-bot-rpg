name: Seven Identity Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Run focused identity test
        shell: bash
        run: |
          set +e
          node --test tests/sevenIdentityRepairs.test.js > seven-test.log 2>&1
          echo "$?" > seven-test.exit
          cat seven-test.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: seven-identity-diagnostic
          path: |
            seven-test.log
            seven-test.exit
      - name: Enforce result
        shell: bash
        run: test "$(cat seven-test.exit)" = "0"
