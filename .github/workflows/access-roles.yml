name: Access Roles

on:
  pull_request:
    paths:
      - 'comandos/cargo.js'
      - 'helpers/clover/accessControlService.js'
      - 'scripts/check-access-roles.js'
      - '.github/workflows/access-roles.yml'
  push:
    branches:
      - main
    paths:
      - 'comandos/cargo.js'
      - 'helpers/clover/accessControlService.js'
      - 'scripts/check-access-roles.js'
      - '.github/workflows/access-roles.yml'

permissions:
  contents: read

concurrency:
  group: access-roles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check comandos/cargo.js
          node --check helpers/clover/accessControlService.js
          node --check scripts/check-access-roles.js

      - name: Check access roles
        run: node scripts/check-access-roles.js

      - name: Upload review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-roles-review
          path: artifacts/access-roles/**
          if-no-files-found: error
          retention-days: 14
