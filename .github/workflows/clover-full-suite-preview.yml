name: Clover full repository regression preview

on:
  push:
    branches:
      - ci/clover-integration-preview-20261115
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clover-full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test-suite:
    name: All Node test suites, isolated preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout combined draft code, not main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete node:test collection
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          node --test --test-concurrency=1 tests/*.test.js > artifacts/full-suite.log 2>&1
          status=$?
          printf 'Exit status: %s\n' "${status}"
          echo '=== Overall summary ==='
          grep -E '^(ℹ|#) (tests|pass|fail|skipped|duration_ms) ' artifacts/full-suite.log | tail -n 12 || true
          echo '=== Last 160 lines, including test failures ==='
          tail -n 160 artifacts/full-suite.log
          exit "${status}"
      - name: Store regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-full-suite-preview
          path: artifacts/full-suite.log
          if-no-files-found: warn
          retention-days: 7
