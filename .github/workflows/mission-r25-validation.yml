name: Clover Mission R25 Validation

on:
  pull_request:
    paths:
      - 'helpers/clover/*Mission*'
      - 'helpers/clover/playerMission*'
      - 'helpers/clover/playerPhase.js'
      - 'helpers/clover/onboardingConfirmationRead.js'
      - 'helpers/magicManager.js'
      - 'helpers/profileForms.js'
      - 'comandos/continuar.js'
      - 'comandos/status.js'
      - 'tests/onboardingReadJourney.test.js'
      - 'tests/onboardingProfileJourney.test.js'
      - 'helpers/clover/slotManager.js'
      - 'helpers/rollManager.js'
      - 'helpers/clover/seasonLabProvisioning.js'
      - 'helpers/clover/targetResolver.js'
      - 'tests/seasonLabProvisioning.test.js'
      - 'scripts/provisionSeasonLab.js'
      - 'scripts/verifySeasonLab.js'
      - 'helpers/clover/seasonLabStartupGuard.js'
      - 'helpers/clover/missionSceneClaims.js'
      - 'helpers/clover/quickEvaluationService.js'
      - 'helpers/clover/antiGhostService.js'
      - 'comandos/missao.js'
      - 'comandos/missoes.js'
      - 'comandos/minhasmissoes.js'
      - 'comandos/missaoAdm.js'
      - 'comandos/missaoReview.js'
      - 'tests/playerMission*'
      - '.github/workflows/mission-r25-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-r25-validation
  cancel-in-progress: true

jobs:
  mission-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mission contracts with real Node and SQLite
        run: node --test tests/playerMissionLifecycle.test.js tests/playerMissionRealPayout.test.js tests/playerMissionNewSeason.test.js tests/playerMissionBoard.test.js tests/playerMissionAuthoring.test.js tests/playerMissionReview.test.js tests/adminMissionService.test.js tests/adminMissionHttp.test.js tests/quickEvaluationAccess.test.js tests/quickEvaluationGroupsPersistence.test.js tests/quickEvaluationSquadStarsIntegration.test.js tests/playerIdentityOpaqueLookup.test.js tests/playerPhaseCanonicalIdentity.test.js tests/playerIdentityCanonicalization.test.js tests/seasonLabProvisioning.test.js tests/onboardingReadJourney.test.js tests/playerPhaseLifecycleGateContract.test.js tests/onboardingProfileJourney.test.js tests/realSlotRollAvailability.test.js
