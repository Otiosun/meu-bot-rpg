name: Mundos dos Sonhos V1

on:
  push:
    branches:
      - feature/mundos-dos-sonhos-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dream-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mundos dos Sonhos tests
        run: npm run test:dream-worlds
