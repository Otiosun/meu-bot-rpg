name: Site API check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check site API syntax
        run: |
          node --check helpers/clover/siteAuthService.js
          node --check helpers/clover/siteApiServer.js
          node --check scripts/startCloverSiteNgrok.js

      - name: Test site authentication
        run: npm run test:site-auth

      - name: Run existing bot checks
        run: npm test
