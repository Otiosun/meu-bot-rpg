name: Apply Site Access Context

on:
  push:
    branches:
      - feat/site-access-context
    paths:
      - 'scripts/patches/site-access-context.patch'
      - '.github/workflows/apply-site-access-context.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'helpers/clover/siteAccessPayloadService.js'
      - 'scripts/check-site-access-payload.js'
      - 'scripts/patches/site-access-context.patch'
      - '.github/workflows/apply-site-access-context.yml'

permissions:
  contents: write

concurrency:
  group: apply-site-access-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply-patch:
    if: github.event_name == 'push' || github.head_ref == 'feat/site-access-context'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/site-access-context
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          git apply --check scripts/patches/site-access-context.patch
          git apply scripts/patches/site-access-context.patch

      - name: Validate patched server
        shell: bash
        run: |
          mkdir -p artifacts/site-access
          node --check helpers/clover/siteApiServer.js
          node --check helpers/clover/siteAccessPayloadService.js
          node --check scripts/check-site-access-payload.js
          set -o pipefail
          node scripts/check-site-access-payload.js 2>&1 | tee artifacts/site-access/test.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-access-patch-review
          path: artifacts/site-access/**
          if-no-files-found: error
          retention-days: 7

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helpers/clover/siteApiServer.js
          git commit -m "feat(site-api): expor contexto autenticado de cargos"
          git push origin HEAD:feat/site-access-context
