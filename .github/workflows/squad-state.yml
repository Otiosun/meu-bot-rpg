name: Squad State

on:
  pull_request:
    paths:
      - 'comandos/estadoEsquadrao.js'
      - 'helpers/clover/squadStateService.js'
      - 'scripts/check-squad-state.js'
      - '.github/workflows/squad-state.yml'
  push:
    branches:
      - main
    paths:
      - 'comandos/estadoEsquadrao.js'
      - 'helpers/clover/squadStateService.js'
      - 'scripts/check-squad-state.js'
      - '.github/workflows/squad-state.yml'

permissions:
  contents: read

concurrency:
  group: squad-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  squad-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check comandos/estadoEsquadrao.js
          node --check helpers/clover/squadStateService.js
          node --check scripts/check-squad-state.js

      - name: Check interpreted squad state
        shell: bash
        run: |
          mkdir -p artifacts/squad-state
          set -o pipefail
          node scripts/check-squad-state.js 2>&1 | tee artifacts/squad-state/test.log

      - name: Upload review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-state-review
          path: artifacts/squad-state/**
          if-no-files-found: error
          retention-days: 14
