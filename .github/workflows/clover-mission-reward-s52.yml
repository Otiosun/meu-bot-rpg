name: Clover Mission Reward Contract S52
on:
  push:
    branches:
      - 'test/clover-mission-reward-ci-s52-20261123'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reward-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Characterize reward contract
        run: node --test tests/cloverMissionRewardContractS51.test.js
