name: Weekly scene date v3

on:
  pull_request:
    branches:
      - main
    paths:
      - 'helpers/clover/quickEvaluationWeekRepairService.js'
      - 'scripts/repairQuickEvaluationWeekKeysV3.js'
      - 'tests/quickEvaluationWeekRepair.test.js'
      - '.github/workflows/weekly-scene-date-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-scene-date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax
        run: |
          node --check helpers/clover/quickEvaluationWeekRepairService.js
          node --check scripts/repairQuickEvaluationWeekKeysV3.js
          node --check tests/quickEvaluationWeekRepair.test.js

      - name: Boundary and repair tests
        env:
          TZ: UTC
        run: node --test tests/quickEvaluationWeekRepair.test.js
