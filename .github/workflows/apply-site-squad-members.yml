name: Apply Site Squad Members

on:
  pull_request:
    branches:
      - main
    paths:
      - 'helpers/clover/siteSquadMemberService.js'
      - 'helpers/clover/accessIntegrationService.js'
      - 'helpers/clover/siteAccessPayloadService.js'
      - 'scripts/check-site-squad-members.js'
      - 'scripts/patches/site-squad-members.patch'
      - '.github/workflows/apply-site-squad-members.yml'

permissions:
  contents: write

concurrency:
  group: apply-site-squad-members-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-patch:
    if: github.head_ref == 'feat/site-squad-member-directory'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/site-squad-member-directory
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        shell: bash
        run: |
          git apply --check scripts/patches/site-squad-members.patch
          git apply scripts/patches/site-squad-members.patch

      - name: Validate route and permissions
        run: |
          node --check helpers/clover/siteApiServer.js
          node --check helpers/clover/siteSquadMemberService.js
          node --check helpers/clover/accessIntegrationService.js
          node --check helpers/clover/siteAccessPayloadService.js
          node --check scripts/check-site-squad-members.js
          node scripts/check-site-squad-members.js

      - name: Commit patched server
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helpers/clover/siteApiServer.js
          git commit -m "feat(site-api): expor diretório autorizado de membros"
          git push origin HEAD:feat/site-squad-member-directory
