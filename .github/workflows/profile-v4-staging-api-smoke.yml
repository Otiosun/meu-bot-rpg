name: Profile V4 staging API smoke

on:
  push:
    branches:
      - qa/profile-v4-staging-api-20261002
    paths:
      - "scripts/startProfileV4QaApi.js"
      - ".github/workflows/profile-v4-staging-api-smoke.yml"
      - ".profile-v4-staging-api-trigger"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check staging runner
        run: node --check scripts/startProfileV4QaApi.js

      - name: Start isolated Clover Site API
        env:
          PORT: "8787"
          CLOVER_QA_DB_FILE: /tmp/clover-profile-v4-smoke.sqlite
          CLOVER_PROFILE_MEDIA_DIR: /tmp/clover-profile-v4-media
          CLOVER_QA_PHONE: "5579999000000"
        run: |
          node scripts/startProfileV4QaApi.js > /tmp/profile-v4-qa.log 2>&1 &
          echo $! > /tmp/profile-v4-qa.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/profile-v4-qa.pid)" 2>/dev/null; then
              cat /tmp/profile-v4-qa.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/profile-v4-qa.log
          exit 1

      - name: Exercise Profile V4 over HTTP
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const sharp = require('sharp');

          const base = 'http://127.0.0.1:8787';
          const log = fs.readFileSync('/tmp/profile-v4-qa.log', 'utf8');
          const match = log.match(/\[profile-v4-qa\] READY (\{[^\n]+\})/);
          if (!match) throw new Error('READY payload not found in staging log');
          const ready = JSON.parse(match[1]);

          async function json(path, init = {}) {
            const response = await fetch(base + path, init);
            const text = await response.text();
            let payload;
            try { payload = text ? JSON.parse(text) : {}; }
            catch { throw new Error(`${path} returned non-JSON: ${text.slice(0, 300)}`); }
            if (!response.ok) throw new Error(`${path} -> ${response.status}: ${JSON.stringify(payload)}`);
            return payload;
          }

          const login = await json('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: ready.phone, code: ready.loginCode }),
          });
          if (!login.token) throw new Error('Login did not return token');
          const auth = { Authorization: `Bearer ${login.token}` };

          const before = await json('/character/profile-presentation', { headers: auth });
          if (before.schemaVersion !== 'profile-presentation.v2') {
            throw new Error(`Unexpected presentation schema: ${before.schemaVersion}`);
          }

          const saved = await json('/character/profile-presentation', {
            method: 'PUT',
            headers: { ...auth, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              preferences: {
                skin: 'oneiric',
                palette: 'teal',
                heroLayout: 'split',
                heroFacts: ['magic', 'race', 'rank'],
                motto: 'Smoke QA',
                featured: 'none',
                featuredId: null,
                sectionOrder: ['history', 'identity', 'links', 'traits', 'effects'],
                hiddenSections: ['effects'],
                sectionStyle: 'minimal',
                showSectionIcons: false,
                showActiveTitle: true,
              },
            }),
          });
          if (saved.preferences?.skin !== 'oneiric' || saved.preferences?.heroLayout !== 'split') {
            throw new Error('Presentation PUT did not persist V2 preferences');
          }

          const media0 = await json('/character/profile-media', { headers: auth });
          if (media0.media?.banner !== null) throw new Error('Expected empty banner before upload');

          const input = await sharp({
            create: {
              width: 1200,
              height: 500,
              channels: 4,
              background: { r: 40, g: 80, b: 120, alpha: 1 },
            },
          }).png().toBuffer();
          const image = `data:image/png;base64,${input.toString('base64')}`;

          const uploaded = await json('/character/profile-media/banner', {
            method: 'PUT',
            headers: { ...auth, 'Content-Type': 'application/json' },
            body: JSON.stringify({ image, focalX: 0.25, focalY: 0.75, zoom: 1.4 }),
          });
          if (uploaded.media?.kind !== 'banner') throw new Error('Banner upload failed');
          if (uploaded.media?.mimeType !== 'image/webp') throw new Error('Banner was not canonicalized to WEBP');

          const patched = await json('/character/profile-media/banner', {
            method: 'PATCH',
            headers: { ...auth, 'Content-Type': 'application/json' },
            body: JSON.stringify({ focalX: 0.9, focalY: 0.1, zoom: 2.2 }),
          });
          if (patched.media?.focalX !== 0.9 || patched.media?.focalY !== 0.1 || patched.media?.zoom !== 2.2) {
            throw new Error('Crop PATCH did not persist');
          }

          const binary = await fetch(base + '/character/profile-media/banner', { headers: auth });
          if (!binary.ok) throw new Error(`Binary banner GET failed: ${binary.status}`);
          if (binary.headers.get('content-type') !== 'image/webp') {
            throw new Error(`Unexpected binary content type: ${binary.headers.get('content-type')}`);
          }
          const bytes = Buffer.from(await binary.arrayBuffer());
          if (!bytes.length) throw new Error('Binary banner is empty');
          if (!binary.headers.get('etag')) throw new Error('Binary banner missing ETag');

          const media1 = await json('/character/profile-media', { headers: auth });
          if (media1.media?.banner?.focalX !== 0.9 || media1.media?.banner?.zoom !== 2.2) {
            throw new Error('Media state did not reflect persisted crop');
          }

          console.log('Profile V4 staging API smoke: PASS');
          console.log(JSON.stringify({
            login: true,
            presentationGet: true,
            presentationPut: true,
            bannerUpload: true,
            binaryGet: true,
            cropPatch: true,
            mediaState: true,
            binaryBytes: bytes.length,
            etag: Boolean(binary.headers.get('etag')),
          }));
          NODE

      - name: Show staging log on failure
        if: failure()
        run: cat /tmp/profile-v4-qa.log || true
