name: Apply Site Squad Upgrades

on:
  pull_request:
    branches:
      - main
    paths:
      - 'helpers/clover/siteSquadUpgradePayloadService.js'
      - 'scripts/check-site-squad-upgrade-catalog.js'
      - 'scripts/patches/site-squad-upgrades.patch'
      - '.github/workflows/apply-site-squad-upgrades.yml'

permissions:
  contents: write

concurrency:
  group: apply-site-squad-upgrades-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-patch:
    if: github.head_ref == 'feat/site-squad-upgrade-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/site-squad-upgrade-catalog
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        shell: bash
        run: |
          git apply --check scripts/patches/site-squad-upgrades.patch
          git apply scripts/patches/site-squad-upgrades.patch

      - name: Validate route and catalog
        run: |
          node --check helpers/clover/siteApiServer.js
          node --check helpers/clover/siteSquadUpgradePayloadService.js
          node --check scripts/check-site-squad-upgrade-catalog.js
          node scripts/check-site-squad-upgrade-catalog.js

      - name: Commit patched server
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helpers/clover/siteApiServer.js
          git commit -m "feat(site-api): expor catálogo autorizado do QG"
          git push origin HEAD:feat/site-squad-upgrade-catalog
