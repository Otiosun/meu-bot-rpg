name: Pre-reset F6-F10 gates

on:
  push:
    branches:
      - candidate/prereset-mythic-launch-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f6-f10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Syntax contracts
        run: |
          node --check helpers/clover/preResetCampaignMigration.js
          node --check helpers/clover/preResetCampaignStateService.js
          node --check helpers/clover/preResetCampaignCloseService.js
          node --check helpers/clover/preResetPurgeHardeningMigration.js
          node --check helpers/clover/preResetLaunchRosterMigration.js
          node --check helpers/clover/pvService.js
          node --check helpers/clover/preResetLaunchService.js
          node --check helpers/clover/preResetPurgeStateService.js
          node --check helpers/clover/preResetPurgeService.js
          node --check helpers/clover/preResetAdminService.js
          node --check helpers/clover/preResetTransitionService.js
          node --check helpers/clover/preResetTransitionAdminHttp.js
          node --check helpers/clover/schemaMigrationPlan.js
          node --check tests/preResetF6F9LaunchGates.test.js
          node --check tests/preResetF10AdminRosterLaunch.test.js
      - name: F6-F10 and foundation regression
        run: |
          node --test tests/preResetTransitionService.test.js
          node --test tests/preResetCharacterLaunchFoundation.test.js
          node --test tests/preResetF6F9LaunchGates.test.js
          node --test tests/preResetF10AdminRosterLaunch.test.js
