name: Site Auth

on:
  pull_request:
    paths:
      - 'comandos/site.js'
      - 'helpers/clover/siteAuthService.js'
      - 'tests/siteAuthService.test.js'
      - '.github/workflows/site-auth.yml'
  push:
    branches:
      - main
    paths:
      - 'comandos/site.js'
      - 'helpers/clover/siteAuthService.js'
      - 'tests/siteAuthService.test.js'
      - '.github/workflows/site-auth.yml'

permissions:
  contents: read

concurrency:
  group: site-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check comandos/site.js
          node --check helpers/clover/siteAuthService.js
          node --check tests/siteAuthService.test.js

      - name: Run site auth tests
        run: node --test tests/siteAuthService.test.js
