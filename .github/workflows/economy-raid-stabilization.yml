name: Economy and Raid Stabilization

on:
  pull_request:
    paths:
      - 'database.js'
      - 'helpers/clover/accessControlService.js'
      - 'helpers/clover/accessControlLegacyService.js'
      - 'helpers/clover/canonicalGlobalAccessService.js'
      - 'helpers/clover/canonicalScopedAccessService.js'
      - 'helpers/clover/canonicalRoleShadowReadOnly.js'
      - 'helpers/clover/economyMutationQueue.js'
      - 'helpers/clover/siteApiServer.js'
      - 'helpers/clover/siteApiServerBase.js'
      - 'helpers/clover/raidService.js'
      - 'helpers/clover/raidServiceBase.js'
      - 'helpers/clover/legacyraidService.js'
      - 'helpers/clover/raidFinalizationService.js'
      - 'helpers/clover/raidRewardProposalService.js'
      - 'helpers/clover/raidRewardProposalCoreService.js'
      - 'helpers/clover/raidRewardProposalRevisionService.js'
      - 'helpers/clover/raidV2Service.js'
      - 'helpers/clover/raidV2Schema.js'
      - 'helpers/clover/raidCategoryCatalog.js'
      - 'helpers/clover/economyService.js'
      - 'helpers/clover/marketService.js'
      - 'helpers/clover/inventoryService.js'
      - 'helpers/clover/yullsService.js'
      - 'tests/canonicalGlobalAccessIntegration.test.js'
      - 'tests/raidRewardProposalAuthorshipGuard.test.js'
      - 'tests/raidRewardProposalRevisionHistory.test.js'
      - 'tests/economyFoundation.test.js'
      - 'tests/economyMutationQueue.test.js'
      - 'tests/economyOperationsV1.test.js'
      - 'tests/marketOperationsV1.test.js'
      - 'tests/customItemsV1.test.js'
      - 'tests/raidFoundation.test.js'
      - 'tests/raidV2.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/economy-raid-stabilization.yml'
  push:
    branches:
      - main
    paths:
      - 'database.js'
      - 'helpers/clover/accessControlService.js'
      - 'helpers/clover/accessControlLegacyService.js'
      - 'helpers/clover/canonicalGlobalAccessService.js'
      - 'helpers/clover/canonicalScopedAccessService.js'
      - 'helpers/clover/canonicalRoleShadowReadOnly.js'
      - 'helpers/clover/economyMutationQueue.js'
      - 'helpers/clover/siteApiServer.js'
      - 'helpers/clover/siteApiServerBase.js'
      - 'helpers/clover/raidService.js'
      - 'helpers/clover/raidServiceBase.js'
      - 'helpers/clover/legacyraidService.js'
      - 'helpers/clover/raidFinalizationService.js'
      - 'helpers/clover/raidRewardProposalService.js'
      - 'helpers/clover/raidRewardProposalCoreService.js'
      - 'helpers/clover/raidRewardProposalRevisionService.js'
      - 'helpers/clover/raidV2Service.js'
      - 'helpers/clover/raidV2Schema.js'
      - 'helpers/clover/raidCategoryCatalog.js'
      - 'helpers/clover/economyService.js'
      - 'helpers/clover/marketService.js'
      - 'helpers/clover/inventoryService.js'
      - 'helpers/clover/yullsService.js'
      - 'tests/canonicalGlobalAccessIntegration.test.js'
      - 'tests/raidRewardProposalAuthorshipGuard.test.js'
      - 'tests/raidRewardProposalRevisionHistory.test.js'
      - 'tests/economyFoundation.test.js'
      - 'tests/economyMutationQueue.test.js'
      - 'tests/economyOperationsV1.test.js'
      - 'tests/marketOperationsV1.test.js'
      - 'tests/customItemsV1.test.js'
      - 'tests/raidFoundation.test.js'
      - 'tests/raidV2.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/economy-raid-stabilization.yml'

permissions:
  contents: read

concurrency:
  group: economy-raid-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  economy-raid:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check stabilization syntax
        run: |
          node --check helpers/clover/accessControlService.js
          node --check helpers/clover/accessControlLegacyService.js
          node --check helpers/clover/canonicalGlobalAccessService.js
          node --check helpers/clover/canonicalScopedAccessService.js
          node --check helpers/clover/canonicalRoleShadowReadOnly.js
          node --check helpers/clover/economyMutationQueue.js
          node --check helpers/clover/siteApiServer.js
          node --check helpers/clover/raidRewardProposalService.js
          node --check helpers/clover/raidRewardProposalCoreService.js
          node --check helpers/clover/raidRewardProposalRevisionService.js
          node --check helpers/clover/raidV2Service.js
          node --check tests/canonicalGlobalAccessIntegration.test.js
          node --check tests/raidRewardProposalAuthorshipGuard.test.js
          node --check tests/raidRewardProposalRevisionHistory.test.js
          node --check tests/economyMutationQueue.test.js
          node --check tests/raidFoundation.test.js
          node --check tests/raidV2.test.js

      - name: Test canonical global authorization
        run: node --test tests/canonicalGlobalAccessIntegration.test.js

      - name: Test immutable proposal authorship
        run: node --test tests/raidRewardProposalAuthorshipGuard.test.js

      - name: Test immutable proposal revisions
        run: node --test tests/raidRewardProposalRevisionHistory.test.js

      - name: Test economy foundation
        run: npm run test:economy-foundation

      - name: Test economy operations and raids
        run: npm run test:economy-operations
