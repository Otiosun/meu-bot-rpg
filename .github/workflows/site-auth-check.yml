name: Site Auth check

on:
  pull_request:
    branches: [main]
    paths:
      - "helpers/clover/siteAuthService.js"
      - "helpers/clover/siteApiServer.js"
      - "helpers/clover/siteApiServerBase.js"
      - "helpers/clover/siteApiBaseRouteDescriptors.js"
      - "helpers/clover/profilePresentationService.js"
      - "helpers/clover/profileMediaService.js"
      - "helpers/clover/schemaMigrationCatalog.js"
      - "helpers/clover/schemaBasePrebootstrapService.js"
      - "tests/profilePresentationService.test.js"
      - "tests/profilePresentationHttp.test.js"
      - "tests/profileMediaService.test.js"
      - "tests/profileMediaHttp.test.js"
      - "tests/databaseMigration0031.test.js"
      - "tests/databaseMigration0032.test.js"
      - "tests/databaseMigrationCatalog.test.js"
      - "tests/schemaBasePrebootstrap.test.js"
      - "scripts/auditPlayerIdentityAliases.js"
      - "scripts/planPlayerIdentityRepairs.js"
      - "scripts/executePlayerIdentityRepairs.js"
      - "tests/siteAuthService.test.js"
      - "tests/playerIdentityCanonicalization.test.js"
      - "tests/identityAuditScript.test.js"
      - "tests/identityRepairPlanner.test.js"
      - "tests/identityRepairExecutor.test.js"
      - "data/clover/estagios.json"
      - "scripts/check-stage-thresholds.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-auth-check.yml"

permissions:
  contents: read

concurrency:
  group: site-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check site API syntax
        run: |
          node --check helpers/clover/siteAuthService.js
          node --check helpers/clover/siteApiServer.js
          node --check helpers/clover/siteApiServerBase.js
          node --check helpers/clover/siteApiBaseRouteDescriptors.js
          node --check helpers/clover/profilePresentationService.js
          node --check helpers/clover/profileMediaService.js
          node --check helpers/clover/schemaMigrationCatalog.js
          node --check helpers/clover/schemaBasePrebootstrapService.js
          node --check tests/profilePresentationService.test.js
          node --check tests/profilePresentationHttp.test.js
          node --check tests/profileMediaService.test.js
          node --check tests/profileMediaHttp.test.js
          node --check tests/databaseMigration0031.test.js
          node --check tests/databaseMigration0032.test.js
          node --check tests/databaseMigrationCatalog.test.js
          node --check tests/schemaBasePrebootstrap.test.js
          node --check scripts/auditPlayerIdentityAliases.js
          node --check scripts/planPlayerIdentityRepairs.js
          node --check scripts/executePlayerIdentityRepairs.js

      - name: Test Profile V4 persistence and media
        run: node --test tests/profilePresentationService.test.js tests/profilePresentationHttp.test.js tests/profileMediaService.test.js tests/profileMediaHttp.test.js tests/databaseMigration0031.test.js tests/databaseMigration0032.test.js tests/databaseMigrationCatalog.test.js tests/schemaBasePrebootstrap.test.js

      - name: Validate progression catalog
        run: npm run check:stage-thresholds

      - name: Test site authentication and identity repair
        run: npm run test:site-auth

      - name: Run existing bot checks
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log

      - name: Upload npm test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-auth-npm-test-failure
          path: npm-test.log
          if-no-files-found: ignore
          retention-days: 1
