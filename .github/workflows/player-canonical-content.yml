name: Canonical Player Content

on:
  pull_request:
    paths:
      - 'helpers/clover/playerContentService.js'
      - 'data/player-canonical-batch-1-import.json'
      - 'scripts/importCanonicalPlayerContentBatch1.js'
      - 'tests/playerCanonicalContentBatch1.test.js'
      - 'package.json'
      - '.github/workflows/player-canonical-content.yml'
  push:
    branches:
      - main
    paths:
      - 'helpers/clover/playerContentService.js'
      - 'data/player-canonical-batch-1-import.json'
      - 'scripts/importCanonicalPlayerContentBatch1.js'
      - 'tests/playerCanonicalContentBatch1.test.js'
      - 'package.json'
      - '.github/workflows/player-canonical-content.yml'

permissions:
  contents: read

concurrency:
  group: canonical-player-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax and manifest
        run: |
          node --check helpers/clover/playerContentService.js
          node --check scripts/importCanonicalPlayerContentBatch1.js
          node -e "const m=require('./data/player-canonical-batch-1-import.json'); if(m.players.length!==10) process.exit(1); const n=m.players.reduce((s,p)=>s+p.records.length,0); if(n!==22) process.exit(1);"

      - name: Test canonical content
        run: node --test tests/playerCanonicalContentBatch1.test.js

      - name: Run data-integrity suite
        run: npm run test:data-integrity
